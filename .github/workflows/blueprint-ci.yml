name: Blueprint CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Blueprint repository
        run: bash scripts/check-repo

      - name: Validate documentation links
        run: bash scripts/check-doc-links

      - name: Validate runtime aggregate contract
        run: bash scripts/check-runtime-aggregate-source

      - name: Validate installer safety contract
        run: bash scripts/check-installer-safety-source

      - name: Validate clone-less remote bootstrap
        run: bash scripts/check-remote-bootstrap-source

      - name: Validate four-profile contract
        run: bash scripts/check-profile-contract-source

      - name: Validate KVM runbook defaults
        run: bash scripts/check-kvm-runbook-source

      - name: Validate display manager contract
        run: bash scripts/check-display-manager-source

      - name: Validate service manifest contract
        run: bash scripts/check-service-manifests-source

      - name: Validate hardware audio policy
        run: bash scripts/check-hardware-audio-source

      - name: Validate Dolphin compact fileExplorer contract
        run: bash scripts/check-dolphin-file-explorer-source

      - name: Validate Dolphin global preview contract
        run: bash scripts/check-dolphin-global-view-source

      - name: Validate Spotify wrapper path contract
        run: bash scripts/check-spotify-wrapper-source

      - name: Validate Bibata cursor contract
        run: bash scripts/check-cursor-source

      - name: Validate TV Cast three-mode contract
        run: bash scripts/check-tv-cast-source

      - name: Validate Caelestia patch contract
        run: bash scripts/check-caelestia-patch-source

      - name: Validate Caelestia CLI ownership
        run: bash scripts/check-caelestia-cli-source

      - name: Validate Quickshell rebuild contract
        run: bash scripts/check-quickshell-rebuild-source
