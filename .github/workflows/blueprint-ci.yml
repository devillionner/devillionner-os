name: Blueprint CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Blueprint repository
        run: bash scripts/check-repo

      - name: Validate Caelestia patch contract
        run: bash scripts/check-caelestia-patch-source
